plugins {
    id 'com.android.application'
}

android {
    namespace 'com.debangshu.note'
    compileSdk 34

    defaultConfig {
        applicationId 'com.debangshu.note'
        minSdk 24          // Android 7.0 and newer
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signs the release build with the debug key so it installs without extra setup
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No libraries: the app only uses what is built into Android.
dependencies {
}
