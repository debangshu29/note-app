plugins {
    id 'com.android.application'
}

android {
    namespace 'com.debangshu.note'
    compileSdk 34

    defaultConfig {
        applicationId 'com.debangshu.note'
        minSdk 24          // Android 7.0 and newer
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // One fixed key for this app, so every new APK installs as an update and keeps your notes.
    // The key is NOT stored in the code: GitHub passes it in from its encrypted Secrets.
    def ksFile = System.getenv('NOTE_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ksFile != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv('NOTE_KEYSTORE_PASSWORD')
                keyAlias 'note'
                keyPassword System.getenv('NOTE_KEYSTORE_PASSWORD')
            } else {
                // building on your own PC without the key: fall back to the debug key
                storeFile signingConfigs.debug.storeFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No libraries: the app only uses what is built into Android.
dependencies {
}
