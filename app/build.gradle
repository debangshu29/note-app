plugins {
    id 'com.android.application'
}

android {
    namespace 'com.debangshu.note'
    compileSdk 34

    defaultConfig {
        applicationId 'com.debangshu.note'
        minSdk 24          // Android 7.0 and newer
        targetSdk 34
        versionCode 23
        versionName '3.6'
        // phones only (ARM): leaves out the emulator (x86) copies of the translate / handwriting engines
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // keep the engines' native code compressed inside the APK, so the update download stays small
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    // One fixed key for this app, so every new APK installs as an update and keeps your notes.
    // The key is NOT stored in the code: GitHub passes it in from its encrypted Secrets.
    def ksFile = System.getenv('NOTE_KEYSTORE_FILE')
    def hasKey = ksFile != null && file(ksFile).exists()
    signingConfigs {
        release {
            if (hasKey) {
                storeFile file(ksFile)
                storePassword System.getenv('NOTE_KEYSTORE_PASSWORD')
                keyAlias 'note'
                keyPassword System.getenv('NOTE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // without the key (e.g. building on your own PC) the debug key is used instead
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Google's on-device text reader (photos / PDFs -> note). Runs on the phone, nothing is uploaded.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
    // Google's document scanner (edge detection, crop, clean-up). Also runs on the phone.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
    // 3.6 — all on the phone: translate (language packs download once), handwriting → text,
    // Google's QR scanner (no camera permission), QR codes, and place reminders (geofencing).
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
