# Builds Note.apk on GitHub's computers every time the code changes.
# Download it from the "Releases" section of the repo (or the Actions tab).
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Note.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Note-apk
          path: Note.apk

      - name: Publish as "latest" release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Note.apk --title "Note app (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download Note.apk below and tap it on your phone to install."
