# Builds Note.apk on GitHub's computers every time the code changes.
# Download it from the "Releases" section of the repo (or the Actions tab).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Load the app's signing key (from encrypted repo Secrets)
        env:
          KS_B64: ${{ secrets.NOTE_KEYSTORE_B64 }}
          NOTE_KEYSTORE_PASSWORD: ${{ secrets.NOTE_KEYSTORE_PASSWORD }}
        run: |
          # diagnostics without revealing the secrets: only lengths
          CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t')
          echo "Key secret length: ${#CLEAN} (expected 3504), password length: ${#NOTE_KEYSTORE_PASSWORD} (expected 24)"
          case "$CLEAN" in MII*) echo "Key secret looks like a key file";; *) echo "Key secret does NOT look like the key file text";; esac
          if [ -n "$KS_B64" ]; then
            # ignore spaces / line breaks that sneak in when copy-pasting
            printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/note.jks"
            echo "Key file size: $(wc -c < "$RUNNER_TEMP/note.jks") bytes (expected 2628)"
            keytool -list -keystore "$RUNNER_TEMP/note.jks" -storepass "$NOTE_KEYSTORE_PASSWORD" | grep -i "SHA-256" || true
            echo "NOTE_KEYSTORE_FILE=$RUNNER_TEMP/note.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret found, using a temporary debug key"
          fi

      - name: Build
        env:
          NOTE_KEYSTORE_PASSWORD: ${{ secrets.NOTE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Note.apk
          # version.json lets the app on the phone know an update is ready
          python3 - <<'PY'
          import json, re
          g = open('app/build.gradle').read()
          code = int(re.search(r'versionCode\s+(\d+)', g).group(1))
          name = re.search(r"versionName\s+'([^']+)'", g).group(1)
          try:
              notes = open('whats-new.txt', encoding='utf-8').read().strip()
          except FileNotFoundError:
              notes = ''
          json.dump({'versionCode': code, 'versionName': name, 'notes': notes},
                    open('version.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('version.json:', code, name)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Note-apk
          path: |
            Note.apk
            version.json

      - name: Publish as "latest" release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Note.apk version.json --title "Note app (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download Note.apk below and tap it on your phone to install."

      - name: Publish to the 'updates' branch (fast downloads for the app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/upd" && cp Note.apk version.json "$RUNNER_TEMP/upd/"
          cd "$RUNNER_TEMP/upd"
          git init -q -b updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Note.apk version.json
          git commit -q -m "Latest build ${GITHUB_SHA::7}"
          # one commit only (force push), so the branch never grows
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" updates
